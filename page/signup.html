<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/style.css">
    <title>Sign up</title>
</head>

<body>
    <div class="container">
        <div id="first-box">
            <svg class="backSvg" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
            </svg><br>
        </div>
        <div class="box">
            <p> Create Account
                <br>
                <span class="textBox"> Please fill the input blow here </span>

            </p>
        </div>

        <form class="input-container" id="myform">
            <div class="input-icon-first">
                <input class="sign-input" type="text" placeholder="FULL NAME" name="username">
            </div>
            <!-- ------------------------------------------------------------------ -->
            <div class="input-icon">
                <input class="sign-input" type="text" placeholder="PHONE" name="phone">
            </div>
            <!-- ------------------------------------------------------------------ -->
            <div class="input-icon">
                <input class="sign-input" type="email" placeholder="EMAIL" name="email">
            </div>
            <!-- ------------------------------------------------------------------ -->

            <div class="input-icon">
                <input class="sign-input" type="password" placeholder="PASSWORLD" name="password">
            </div>
            <!-- ------------------------------------------------------------------ -->

            <div class="input-icon">
                <input class="sign-input" type="password" placeholder="CONFIRM PASSWORLD" name="confirmpass">
            </div>
            <!-- ------------------------------------------------------------------ -->

            <div class="sign-btn">
                <button id="formBtn">
                    SIGN UP
                </button>
            </div>
        </form>

    </div>

    <script src="../app/signup.js"></script>
</body>

</html>
