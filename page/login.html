<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>log in</title>
    <link rel="stylesheet" href="../style/style.css">

</head>

<body>
    <div class="logContainer">
        <div class="img-box"></div>
        <div class="log-text">
            <h1>login</h1>
            <p>please sign in to continue</p>
        </div>
        <form class="log-input" id="loginForm">

            <div class="input-icon-first">
                <input class="sign-input" type="email" placeholder="EMAIL" name="email">
            </div>
            <!-- ------------------------------------------------------------------ -->
            <div class="input-icon">
                <input class="sign-input" type="password" placeholder="PASSWORLD" name="password">
            </div>
            <!-- ------------------------------------------------------------------ -->

            <div class="login-btn">
                <button style="margin-bottom: 10px;" id="logformBtn">
                    LOGIN
                </button>
                <a style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;" href="#"
                    class="log-forgot">forgot passworld?</a>
            </div>

        </form>    


    </div>
<script src="../app/login.js"></script>
</body>

</html>
